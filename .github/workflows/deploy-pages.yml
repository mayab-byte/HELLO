# פריסה אוטומטית של האתר ל-GitHub Pages.
#
# הפעלה חד-פעמית: Settings → Pages → Source: GitHub Actions.
# מאותו רגע כל push לענף הזה מפרסם מחדש.
#
# BASE_PATH נדרש כי Pages מגיש את האתר תחת /<שם-המאגר>/ ולא בשורש הדומיין.
# את הערך מספק configure-pages, כדי לא לנחש את שם המאגר.
# בפריסה לדומיין של לקוח (Vercel/Netlify/שרת) פשוט לא מעבירים אותו,
# והאתר יושב בשורש.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/website-infrastructure-cms-kz17qu, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# פריסה אחת בכל רגע נתון; ריצה חדשה לא מבטלת פריסה שכבר החלה.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # דורש הפעלה חד-פעמית: Settings → Pages → Source: GitHub Actions.
      # enablement: true נוסה ונדחה — לטוקן של Actions אין הרשאה ליצור
      # אתר Pages ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5
        id: pages

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # next build + אפיית הפתקים של Design Studio, אל תוך out/
      - name: Build static site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      # שכבת ביטחון: התוצר חייב לצאת נקי ממערכת העורך.
      - name: Verify the editor is absent from the output
        run: |
          if grep -rlE 'ds-panel|buildLiveCss|Design Studio' out/ ; then
            echo "::error::נמצאו שאריות של Design Studio בתוצר הפרודקשן"
            exit 1
          fi
          echo "התוצר נקי ממערכת העורך ✓"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
